name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugin/package-lock.json
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.5
      - name: Build and pack
        working-directory: plugin
        run: |
          npm ci
          npm run typecheck
          npm run build
          npm run build:tui
          npm pack
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release create "$TAG" plugin/opencode-tally-*.tgz \
            --title "$TAG" \
            --generate-notes
